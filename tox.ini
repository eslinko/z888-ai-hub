[tox]
envlist = py38,py39,py310,py311
isolated_build = True

[testenv]
description = run unit tests
deps =
    pytest>=7.0.0
    pytest-asyncio>=0.21.0
    pytest-cov>=4.0.0
    pytest-mock>=3.10.0
commands =
    pytest {posargs:tests}

[testenv:coverage]
description = create and upload coverage report
deps =
    coverage>=7.0.0
    codecov>=2.1.0
commands =
    coverage run -m pytest {posargs:tests}
    coverage report
    coverage html
    codecov

[testenv:lint]
description = run linters
deps =
    flake8>=6.0.0
    black>=23.0.0
    isort>=5.12.0
    mypy>=1.0.0
    pylint>=3.0.0
    bandit>=1.7.0
commands =
    flake8 {posargs:z888_ai_hub tests}
    black --check {posargs:z888_ai_hub tests}
    isort --check-only {posargs:z888_ai_hub tests}
    mypy {posargs:z888_ai_hub}
    pylint {posargs:z888_ai_hub}
    bandit -r {posargs:z888_ai_hub}

[testenv:docs]
description = build documentation
deps =
    sphinx>=6.0.0
    sphinx-rtd-theme>=1.0.0
commands =
    sphinx-build -b html {posargs:docs docs/_build/html} 