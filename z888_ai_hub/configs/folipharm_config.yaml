connectors:
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    base_url: https://api.anthropic.com
    default_model: claude-3-sonnet-20240229
    capabilities:
      - summary
      - text_generation
      - classification
      - vectorization
      - ocr
    summary_config:
      max_length: 1000
      temperature: 0.7

  mix_api:
    providers:
      anthropic:
        api_key: ${ANTHROPIC_API_KEY}
        base_url: https://api.anthropic.com
        default_model: claude-3-sonnet-20240229
    tasks:
      vectorization:
        provider: anthropic
        model: claude-3-sonnet-20240229
        capabilities:
          enabled: true
          dimensions: 1536
          batch_size: 100

tasks:
  summary:
    provider: anthropic
    fallback_providers: []
    max_retries: 3
    timeout: 30

  vectorization:
    provider: anthropic
    fallback_providers: []
    max_retries: 3
    timeout: 30

processing:
  file_types: [".pdf", ".doc", ".docx", ".txt", ".xlsx", ".xls", ".ppt", ".pptx"]
  max_file_size: 10485760  # 10MB
  batch_size: 3
  summary_length: 1000
  vector_dimension: 1536

folders:
  root: /Users/eslinko/Downloads/FoliPharm
  sections:
    - client_letters
    - mom_kid_dad_products
    - registration_documents
    - contracts_and_ndas
    - market_research
    - presentations 